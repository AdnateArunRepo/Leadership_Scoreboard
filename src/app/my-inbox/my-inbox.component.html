<div class="inbox-container">

  <!-- Header -->
  <div class="inbox-header">
    <div class="header-left">
      <!--span class="hamburger">&#9776;</span-->
      <span class="header-title">My Inbox</span>
    </div>

    <div class="header-brand">Leadership Scoreboard</div>

    <div class="header-right">
      <!--span class="icon-circle">&#128276;</span>
      <span class="icon-circle">&#128100;</span-->
    </div>
    
  </div>

  <!-- Tabs + Search -->
  <div class="toolbar-row">
    <div class="tabs">
      <span
        class="tab"
        [class.active]="activeTab === 'pending'"
        (click)="switchTab('pending')">
        Pending Tasks
      </span>
      <span
        class="tab"
        [class.active]="activeTab === 'completed'"
        (click)="switchTab('completed')">
        Completed Tasks
      </span>
    </div>

    <input
      type="text"
      class="search-input"
      placeholder="Search tasks..."
      [(ngModel)]="searchTerm" />
  </div>

  <!-- Table -->
  <table class="task-table">
    <thead>
      <tr>
    <th>Request ID</th>
      <th>Assigned On</th>
      <th>Subject</th>
            <th>Action</th>

      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let task of currentTasks">
        <td>{{ task.requestId }}</td>
      <td>{{ task.assignedOn }}</td>
      <td>{{ task.subject }}</td>
<td>
          <button class="open-task-btn" (click)="openTask(task)">Open Task</button>
        </td>
      </tr>
      <tr *ngIf="currentTasks.length === 0">
        <td colspan="6" class="no-data">No tasks found.</td>
      </tr>
    </tbody>
  </table>

</div>
